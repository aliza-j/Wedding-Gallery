<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harith & Siti's Wedding Gallery</title>
  <link rel="stylesheet" href="style.css">
  <!-- Include Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="hero">
    <h1>Harith & Siti</h1>
    <p class="subtitle">Welcome to our wedding gallery! Share your captured moments with us.</p>
  </header>

  <main class="container">
    <!-- Upload Section -->
    <section class="upload-card">
      <h2>Upload Your Photo</h2>
      
      <div class="upload-actions">
        <!-- Hidden Inputs triggered by custom buttons -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
        <input type="file" id="galleryInput" accept="image/*" hidden>

        <button type="button" class="btn btn-primary" onclick="document.getElementById('cameraInput').click()">
          📸 Take Photo
        </button>
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('galleryInput').click()">
          🖼️ Choose from Gallery
        </button>
      </div>

      <!-- Preview & Caption Form -->
      <form id="uploadForm" class="upload-form hidden">
        <div class="preview-container">
          <img id="imagePreview" src="" alt="Selected Photo Preview">
        </div>
        
        <div class="form-group">
          <label for="caption">Add a Caption:</label>
          <input type="text" id="caption" placeholder="E.g., Cutting the cake! 🍰" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-submit">Upload to Gallery</button>
      </form>
    </section>

    <!-- Gallery Section -->
    <section class="gallery-section">
      <h2>Guest Gallery</h2>
      <div id="galleryGrid" class="gallery-grid">
        <p class="loading-text">Loading wedding memories...</p>
      </div>
    </section>
  </main>

  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
